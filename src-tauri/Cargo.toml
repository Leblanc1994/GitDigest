[package]
name = "daily-engine"
version = "0.1.0"
description = "Turn local Git activity into daily and weekly reports"
authors = ["Daily Engine"]
edition = "2021"

[lib]
name = "daily_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
